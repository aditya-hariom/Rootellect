<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2F6F3"/>
      <stop offset="100%" stop-color="#E1ECE5"/>
    </linearGradient>
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B3329"/>
      <stop offset="35%" stop-color="#244537"/>
      <stop offset="70%" stop-color="#1E3A2F"/>
      <stop offset="100%" stop-color="#13241D"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1F2321"/>
      <stop offset="50%" stop-color="#363C38"/>
      <stop offset="100%" stop-color="#181B19"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#1B3329" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="400" height="500" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative ring -->
  <circle cx="200" cy="245" r="165" fill="none" stroke="#CADCD1" stroke-width="1.5" stroke-dasharray="4 6"/>

  <!-- Shadow ellipse -->
  <ellipse cx="200" cy="445" rx="90" ry="14" fill="#0C1A14" opacity="0.15" filter="blur(6px)"/>

  <!-- Bottle Group -->
  <g filter="url(#shadow)">
    <!-- Cap -->
    <rect x="155" y="70" width="90" height="38" rx="6" fill="url(#capGrad)"/>
    <line x1="158" y1="78" x2="242" y2="78" stroke="#484F4A" stroke-width="1.5"/>
    <line x1="158" y1="88" x2="242" y2="88" stroke="#484F4A" stroke-width="1.5"/>
    <line x1="158" y1="98" x2="242" y2="98" stroke="#484F4A" stroke-width="1.5"/>

    <!-- Neck -->
    <rect x="166" y="106" width="68" height="26" fill="#1C352B"/>

    <!-- Bottle Body -->
    <path d="M 125,170 C 125,135 155,130 166,130 L 234,130 C 245,130 275,135 275,170 L 275,410 C 275,422 265,430 252,430 L 148,430 C 135,430 125,422 125,410 Z" fill="url(#bottleGrad)"/>

    <!-- Glass Highlights -->
    <path d="M 132,175 L 132,415" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Label -->
    <rect x="135" y="195" width="130" height="205" rx="6" fill="#FAF8F5"/>
    
    <!-- Label Brand -->
    <text x="200" y="222" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="2.5" fill="#1E3A2F" text-anchor="middle">ROOTELLECT</text>
    <line x1="155" y1="232" x2="245" y2="232" stroke="#8FA382" stroke-width="1" stroke-opacity="0.6"/>

    <!-- Product Title -->
    <text x="200" y="260" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#13241D" text-anchor="middle">MIND CALM</text>
    <text x="200" y="278" font-family="system-ui, sans-serif" font-size="9" font-weight="600" letter-spacing="1" fill="#5F7565" text-anchor="middle">COGNITIVE EQUILIBRIUM</text>

    <!-- Botanical Symbol -->
    <g transform="translate(186, 292) scale(0.7)">
      <path d="M20 2C20 2 20 14 10 18C20 18 20 34 20 34C20 34 20 18 30 18C20 14 20 2 20 2Z" fill="#8FA382" opacity="0.85"/>
    </g>

    <!-- Info details -->
    <text x="200" y="342" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#2E4A3C" text-anchor="middle">30 CAPSULES</text>
    <text x="200" y="358" font-family="system-ui, sans-serif" font-size="8" fill="#758279" text-anchor="middle">Ashwagandha + L-Theanine</text>

    <!-- Quality Tag -->
    <rect x="156" y="372" width="88" height="15" rx="7.5" fill="#EAEFE9"/>
    <text x="200" y="383" font-family="system-ui, sans-serif" font-size="7.5" font-weight="700" letter-spacing="0.5" fill="#1E3A2F" text-anchor="middle">100% BOTANICAL</text>
  </g>
</svg>
